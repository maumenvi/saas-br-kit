name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão SemVer sem o prefixo v, por exemplo 1.2.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish @maumenvi/saas-br-kit
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@maumenvi'

      - name: Validate release version
        run: |
          node --input-type=module --eval "
            const version = process.env.RELEASE_VERSION;
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            if (!semver.test(version)) {
              throw new Error('Versão SemVer inválida: ' + version);
            }
          "

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate source and package
        run: npm run ci

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create version commit and tag
        run: |
          CURRENT_VERSION="$(node --print "require('./package.json').version")"
          if [ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]; then
            if git rev-parse --quiet --verify "refs/tags/$RELEASE_TAG"; then
              echo "A tag $RELEASE_TAG já existe para outra versão do manifest."
              exit 1
            fi
            npm version "$RELEASE_VERSION" --message "chore(release): v%s"
          elif git rev-parse --quiet --verify "refs/tags/$RELEASE_TAG"; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "A tag $RELEASE_TAG não aponta para o commit atual."
              exit 1
            fi
          else
            git tag --annotate "$RELEASE_TAG" --message "$RELEASE_TAG"
          fi

      - name: Push version and tag
        run: |
          git push origin "HEAD:$DEFAULT_BRANCH"
          git push origin "$RELEASE_TAG"

      - name: Publish private package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@maumenvi/saas-br-kit@$RELEASE_VERSION" version \
            --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "A versão $RELEASE_VERSION já está publicada."
          else
            npm publish
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "O GitHub Release $RELEASE_TAG já existe."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
